research_interests: >
  My research interests are in nonlinear dynamical systems and the control of agents within such systems.
  Some of the fundamental research challenges that I am interested in are: denoising diffusion control,
  stochastic trajectory optimization, stability analysis, controlling objects in hypersonic rarefied flow,
  performing autonomous proximity operations with interacting fluid boundary layers or under chaotic dynamics,
  system identification for feedback control systems, and explainable nonlinear controllers. Specifically,
  this can be applied to cases of chaotic gravitational flow fields, such as cislunar space, combined drag
  and gravitational effects of spacecraft in very low Earth orbit (VLEO), and the control of unmanned
  undersea vehicles (UUVs) in turbulent waters. I also have experience in deep computer vision and signal
  processing for space situational awareness as well as general data analysis and simulation for
  investigating the stability of planetary systems.

